# D1 の中継 Worker。本番の D1 を作ったら database_id を書き換える (README の「本番の DB」)
name = "wotagei-battle-log-d1-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "wotagei-battle-log"
database_id = "00000000-0000-0000-0000-000000000000"
# マイグレーションは drizzle-kit が生成したものを、そのまま wrangler d1 migrations apply で流す
migrations_dir = "../../server/db/migrations"
