name: chromatic

on:
  push:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ベースラインの探索と TurboSnap (onlyChanged) に git 履歴全体が必要
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: bun install --frozen-lockfile
      - uses: chromaui/action@f305ef908327aee3b80b0e6b3bbb60a742eaa049 # v18.13.6
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 結果は Chromatic が PR の UI Tests チェックとして報告するので、アップロードで終える
          exitOnceUploaded: true
          # Dependabot の push では Actions の secret が使えない
          skip: "dependabot/**"
