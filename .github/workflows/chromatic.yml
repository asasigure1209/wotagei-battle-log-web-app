name: chromatic

on:
  push:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ベースラインの探索と TurboSnap (onlyChanged) に git 履歴全体が必要
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 結果は Chromatic が PR の UI Tests チェックとして報告するので、アップロードで終える
          exitOnceUploaded: true
          # Dependabot の push では Actions の secret が使えない
          skip: 'dependabot/**'
