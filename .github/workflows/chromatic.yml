name: chromatic

on:
  push:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ベースラインの探索と TurboSnap (onlyChanged) に git 履歴全体が必要
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - uses: chromaui/action@38afd264ef2241136f12d039093c2724748bec08 # v18.11.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 結果は Chromatic が PR の UI Tests チェックとして報告するので、アップロードで終える
          exitOnceUploaded: true
          # Dependabot の push では Actions の secret が使えない
          skip: 'dependabot/**'
