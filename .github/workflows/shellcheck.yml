name: shellcheck

on:
  pull_request:
    paths:
      - video-uploader/mise-tasks/**
      - .github/workflows/shellcheck.yml

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest のランナーには shellcheck が最初から入っている
      - run: shellcheck video-uploader/mise-tasks/*
